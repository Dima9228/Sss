<!DOCTYPE html>
<html lang="ru">
<head>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e1f22">
<link rel="apple-touch-icon" href="icon-192.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кордик — чат для своих</title>
<style>
:root{--bg:#fff;--bg2:#f2f3f5;--bg3:#e3e5e8;--inp:#ebedef;--tx:#313338;--hd:#060607;--mut:#5c5e66;--acc:#5865f2;--grn:#23a55a;--red:#da373c;--bd:#e1e2e4;--hov:#e8e9eb;--sel:#d7d9dc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#313338;--bg2:#2b2d31;--bg3:#1e1f22;--inp:#383a40;--tx:#dbdee1;--hd:#f2f3f5;--mut:#949ba4;--bd:#1f2023;--hov:#35373c;--sel:#404249;--red:#f23f43}}
:root[data-theme="dark"]{--bg:#313338;--bg2:#2b2d31;--bg3:#1e1f22;--inp:#383a40;--tx:#dbdee1;--hd:#f2f3f5;--mut:#949ba4;--bd:#1f2023;--hov:#35373c;--sel:#404249;--red:#f23f43}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg3)}
html,body{height:100%;margin:0}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font:16px/1.375 "gg sans","Noto Sans","Helvetica Neue",Helvetica,Arial,sans-serif;overflow:hidden}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:flex;height:100%}
.side{display:flex;flex:none}
.rail{width:72px;background:var(--bg3);display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0;overflow-y:auto;scrollbar-width:none}
.srv{position:relative;width:48px;height:48px;flex:none;border-radius:50%;border:0;background:var(--bg);color:var(--tx);font-weight:600;font-size:18px;transition:border-radius .15s,background .15s}
.srv:hover,.srv.on{border-radius:16px;background:var(--acc);color:#fff}
.srv::before{content:"";position:absolute;left:-12px;top:50%;width:8px;height:0;border-radius:0 4px 4px 0;background:var(--hd);transform:translateY(-50%);transition:height .15s}
.srv:hover::before{height:20px}
.srv.on::before{height:40px}
.srv.add{color:var(--grn);font-size:26px;font-weight:400}
.srv.add:hover{background:var(--grn);color:#fff}
.sep{width:32px;height:2px;border-radius:1px;background:var(--hov);flex:none}
.chs{width:240px;background:var(--bg2);display:flex;flex-direction:column;min-height:0;border-radius:8px 0 0 0}
.chs h2{margin:0;height:48px;flex:none;padding:0 16px;display:flex;align-items:center;font-size:16px;font-weight:600;color:var(--hd);border-bottom:1px solid var(--bd)}
#chl{flex:1;overflow-y:auto;padding:0 8px}
.cat{display:flex;align-items:center;width:100%;border:0;background:none;padding:16px 4px 4px 0;font-size:12px;font-weight:600;text-transform:uppercase;color:var(--mut);text-align:left}
.cat:hover{color:var(--hd)}
.cat span{margin-left:auto;font-size:18px;padding:0 4px}
.ch{display:flex;align-items:center;gap:6px;width:100%;border:0;background:none;padding:6px 8px;border-radius:4px;color:var(--mut);font-weight:500;margin-bottom:2px;text-align:left}
.ch:hover{background:var(--hov);color:var(--tx)}
.ch.on{background:var(--sel);color:var(--hd)}
.ch i{font-style:normal;font-size:20px;line-height:1;width:22px;text-align:center;opacity:.75}
.vm{display:flex;align-items:center;gap:8px;padding:3px 8px 3px 30px;color:var(--mut);font-size:14px}
.vm .av{width:24px;height:24px;font-size:12px}
.vm.sp .av{box-shadow:0 0 0 2px var(--grn)}
#vp{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--bd)}
#vp[hidden]{display:none}
#mp{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--bd);font-size:13px;color:var(--mut)}
#mp[hidden]{display:none}
#mp span{flex:1}
#mp button{border:0;border-radius:4px;background:var(--acc);color:#fff;padding:6px 10px;font-weight:500}
#vp div{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
#vp b{color:var(--grn);font-size:14px}
#vp small{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#up{display:flex;align-items:center;gap:6px;height:52px;flex:none;padding:0 8px;background:var(--bg3)}
.un{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.un b{font-size:14px;color:var(--hd);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.un small{font-size:12px;color:var(--mut)}
#up button,#vp button{width:32px;height:32px;border:0;border-radius:6px;background:none;font-size:16px}
#up button:hover,#vp button:hover{background:var(--hov)}
#up button.off{background:rgba(242,63,67,.2)}
.av{width:40px;height:40px;flex:none;border-radius:50%;color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;position:relative}
.av.on::after{content:"";position:absolute;right:-3px;bottom:-3px;width:8px;height:8px;border-radius:50%;background:var(--grn);border:3px solid var(--bg2)}
#up .av{width:32px;height:32px;font-size:14px}
#up .av::after{border-color:var(--bg3)}
main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
header{height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--bd);font-weight:600;color:var(--hd)}
.hash{color:var(--mut);font-size:24px;font-weight:400}
.gap{flex:1}
header button{border:0;background:none;font-size:18px;color:var(--mut)}
#menu{display:none}
.body{flex:1;display:flex;min-height:0}
.mc{flex:1;display:flex;flex-direction:column;min-width:0}
#msgs{flex:1;overflow-y:auto;padding:16px 0 8px}
.empty{color:var(--mut);text-align:center;margin-top:40px;padding:0 20px}
.big{margin-top:16px;border:0;border-radius:8px;background:var(--acc);color:#fff;padding:12px 20px;font-weight:600;font-size:16px}
.day{display:flex;align-items:center;gap:8px;margin:24px 16px 8px;color:var(--mut);font-size:12px;font-weight:600}
.day::before,.day::after{content:"";flex:1;height:1px;background:var(--hov)}
.m{display:flex;gap:16px;padding:2px 16px;margin-top:17px}
.m.cont{margin-top:0}
.m:hover{background:rgba(128,128,128,.08)}
.m .av{margin-top:2px}
.m.cont .av{visibility:hidden;height:0}
.m .bd{min-width:0}
.m .h b{color:var(--hd);font-weight:500;margin-right:8px}
.m time{color:var(--mut);font-size:12px}
.m .t{white-space:pre-wrap;word-break:break-word}
#cmp{display:flex;align-items:flex-end;margin:0 16px 24px;padding:0 6px 0 16px;background:var(--inp);border-radius:8px}
#in{flex:1;resize:none;border:0;background:none;padding:11px 0;max-height:50vh;outline:none;line-height:22px}
#go{width:40px;height:44px;border:0;background:none;color:var(--acc);font-size:20px}
#mem{width:240px;flex:none;background:var(--bg2);overflow-y:auto;padding:8px}
#mem.hide{display:none}
#mem h3{margin:16px 8px 4px;font-size:12px;font-weight:600;text-transform:uppercase;color:var(--mut)}
.mb{display:flex;align-items:center;gap:12px;padding:6px 8px;border-radius:4px;color:var(--mut);font-weight:500}
.mb:hover{background:var(--hov);color:var(--tx)}
.mb .av{width:32px;height:32px;font-size:14px}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:20}
#dlg[hidden]{display:none}
#dlg>div{background:var(--bg);border-radius:8px;padding:20px;width:min(380px,92vw);display:flex;flex-direction:column;gap:12px}
#dlg h3{margin:0;color:var(--hd)}
#di{border:0;border-radius:4px;background:var(--bg3);padding:10px;outline:none}
#dlg .row{flex-direction:row;justify-content:flex-end;align-items:center}
#dno{border:0;background:none;color:var(--tx)}
#dok{border:0;border-radius:4px;background:var(--acc);color:#fff;padding:10px 16px;font-weight:500}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--bg3);color:var(--hd);padding:10px 16px;border-radius:6px;opacity:0;transition:.2s;pointer-events:none;z-index:30;max-width:90vw}
#toast.on{opacity:1}
.m{position:relative}
.acts{display:none;position:absolute;right:16px;top:-16px;gap:2px;padding:2px;background:var(--bg);border:1px solid var(--bd);border-radius:6px;z-index:2}
.m:hover .acts,.m.sel .acts{display:flex}
.acts button{border:0;background:none;padding:3px 6px;border-radius:4px;font-size:15px}
.acts button:hover{background:var(--hov)}
.rq{color:var(--mut);font-size:13px;border-left:3px solid var(--hov);padding-left:8px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pm{margin-left:6px;font-size:12px}
.m.pin{background:rgba(250,166,26,.09)}
.t code{background:var(--bg3);padding:1px 4px;border-radius:4px;font-size:90%}
.t pre{background:var(--bg3);padding:8px 10px;border-radius:6px;overflow-x:auto;margin:4px 0;font-size:90%}
.t a{color:#00a8fc}
.men{background:rgba(88,101,242,.3);color:var(--hd);border-radius:3px;padding:0 2px}
.ed{color:var(--mut);font-size:11px}
.pic{display:block;max-width:min(320px,100%);max-height:320px;border-radius:8px;margin-top:4px;cursor:zoom-in}
.rcs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.rc{border:1px solid transparent;border-radius:8px;background:var(--bg2);padding:1px 8px;font-size:14px}
.rc.me{border-color:var(--acc);background:rgba(88,101,242,.15)}
.ed2{width:100%;border:0;border-radius:6px;background:var(--inp);padding:8px;resize:vertical;min-height:60px;outline:none}
#rp{display:flex;align-items:center;gap:8px;margin:0 16px;padding:6px 12px;background:var(--bg2);border-radius:8px 8px 0 0;font-size:13px;color:var(--mut)}
#rp[hidden]{display:none}
#rp span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rp button{border:0;background:none;color:var(--mut)}
#ty{height:18px;margin:0 16px;font-size:12px;color:var(--mut)}
#att,#emo{width:40px;height:44px;border:0;background:none;font-size:20px;margin-left:-10px}
#att{margin-left:-12px}
#ep{position:absolute;right:16px;bottom:78px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:8px;background:var(--bg2);border:1px solid var(--bd);border-radius:8px;z-index:5}
#ep[hidden]{display:none}
#ep button{border:0;background:none;font-size:22px;padding:4px;border-radius:4px}
#ep button:hover{background:var(--hov)}
.mc{position:relative}
#sq{width:130px;border:0;border-radius:4px;background:var(--bg3);color:var(--tx);padding:4px 8px;font-size:13px;outline:none}
#pn{opacity:.6}
#pn.on{opacity:1}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
.zoom img{max-width:94vw;max-height:94vh;border-radius:8px}
:root.compact .m{margin-top:6px}
:root.compact .m.cont{margin-top:0}
#st{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:40}
#st>div{background:var(--bg);border-radius:8px;padding:20px;width:min(380px,92vw);display:flex;flex-direction:column;gap:14px}
#st h3{margin:0;color:var(--hd)}
.row2{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sws{display:flex;gap:8px}
.sws button{width:28px;height:28px;border-radius:50%;border:2px solid transparent}
.sws button.on{border-color:var(--hd)}
.seg button{border:0;padding:6px 10px;background:var(--bg3);color:var(--tx)}
.seg button.on{background:var(--acc);color:#fff}
@media (max-width:700px){#sq{width:90px}}
.vm .vol{width:64px;margin-left:auto;accent-color:var(--acc)}
.mb span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.cb{border:0;background:none;font-size:16px;border-radius:6px;padding:4px 6px}
.cb:hover{background:var(--hov)}
#dm{position:fixed;inset:0;z-index:60;background:linear-gradient(#1e1f22,#2b2d31);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px))}
.dmrow{display:flex;gap:32px}
.av.cav{width:112px;height:112px;font-size:44px;transition:box-shadow .15s}
.cav.sp{box-shadow:0 0 0 4px var(--grn)}
.cav.ring{animation:pulse 1.3s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(35,165,90,.7)}100%{box-shadow:0 0 0 28px rgba(35,165,90,0)}}
.dmn{font-size:24px;font-weight:600}
.dmt{color:#b5bac1}
.dmb{display:flex;gap:18px;margin-top:12px}
.dmb button{width:64px;height:64px;border-radius:50%;border:0;font-size:26px;background:#383a40;color:#fff}
.dmb .red{background:#da373c}
.dmb .grn{background:#23a55a}
.dmb .off{background:#fff;color:#111}
#dm{background:#1e1f22;justify-content:flex-start;gap:16px}
#dm.in{justify-content:center}
.dmtop{display:flex;align-items:center;gap:12px;width:100%;max-width:1100px}
.dmtop button{width:36px;height:36px;border:0;border-radius:50%;background:#383a40;color:#fff;font-size:18px}
.dmtop .dmt{margin-left:auto}
.dmrow{flex:1;align-content:center;flex-wrap:wrap;justify-content:center;gap:12px;width:100%;max-width:1100px;min-height:0;overflow:auto}
.tile{position:relative;flex:1 1 300px;max-width:520px;aspect-ratio:16/9;background:#2b2d31;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;outline:3px solid transparent;outline-offset:-3px;transition:outline-color .12s}
.tile.sp{outline-color:#23a55a}
.tile .av{width:96px;height:96px;font-size:38px}
.tile video{width:100%;height:100%;object-fit:cover;background:#000}
.tile video.sc{object-fit:contain}
.tile.wait .av{opacity:.5;animation:pulse 1.3s infinite}
.tn{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;background:rgba(0,0,0,.6);padding:3px 9px;border-radius:6px;font-size:14px}
.av.big{width:140px;height:140px;font-size:56px}
.cw{display:flex;flex-direction:column;align-items:center;gap:6px}
.cw small{color:#b5bac1}
#dm:not(.in) .dmb{margin-top:auto}
#dm:not(.in) .dmb .red{width:84px;border-radius:32px}
#dmm{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:60;display:flex;border-radius:999px;overflow:hidden;background:#23a55a;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#dmm button{border:0;background:none;color:#fff;padding:8px 14px;font-weight:600}
#dmm .mx{background:#da373c}
.scrim{display:none}
@media (max-width:1000px){#mem{display:none;position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);right:0;z-index:12;box-shadow:-4px 0 16px rgba(0,0,0,.4)}#mem.show{display:block}}
@media (max-width:700px){
.side{position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);left:0;z-index:10;transform:translateX(-100%);transition:.2s}
.side.open{transform:none}
.scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9}
#menu{display:block}
.chs{width:calc(100vw - 72px - 48px)}
#cmp{margin:0 12px 12px}
}
</style>
</head>
<body>
<div id="app">
  <div class="scrim" id="scrim"></div>
  <div class="side" id="side">
    <nav class="rail" id="rail"></nav>
    <section class="chs">
      <h2 id="sname">Кордик</h2>
      <div id="chl"></div>
      <div id="mp" hidden><span id="mt"></span><button id="mg">Разрешить</button></div>
      <div id="vp" hidden><div><b>Голосовая связь подключена</b><small id="cn"></small></div><button id="lv" title="Отключиться">📞</button></div>
      <div id="up"><div class="av on" id="uav">?</div><div class="un"><b id="unm">Гость</b><small>В сети</small></div><button id="umic" title="Микрофон">🎤</button><button id="udeaf" title="Наушники">🎧</button><button id="uset" title="Светлая или тёмная тема">⚙️</button></div>
    </section>
  </div>
  <main>
    <header><button id="menu" aria-label="Меню">☰</button><span class="hash">#</span><span id="title"></span><span class="gap"></span><input id="sq" placeholder="Поиск" maxlength="40"><button id="pn" title="Закреплённые">📌</button><button id="mbtn" title="Участники">👥</button></header>
    <div class="body">
      <div class="mc"><div id="msgs"></div><div id="ty"></div><div id="rp" hidden></div><div id="cmp"><button id="att" title="Фото">📎</button><textarea id="in" rows="1" placeholder="Написать сообщение"></textarea><button id="emo" title="Эмодзи">😀</button><button id="go" title="Отправить">➤</button></div><input type="file" id="fl" accept="image/*" hidden><div id="ep" hidden></div></div>
      <aside id="mem"></aside>
    </div>
  </main>
</div>
<div id="dlg" hidden><div><h3 id="dt"></h3><input id="di" maxlength="40"><div class="row"><button id="dno">Отмена</button><button id="dok">Создать</button></div></div></div>
<div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* Автономный режим: вместо Claude используется бесплатный Firebase (база + вход + сигналы для звонков). */
(function(){
if(window.claude)return;
const KEY="kordik_cfg",NK="kordik_name",PEER=Math.random().toString(36).slice(2,12);
const COL=["#5865f2","#3ba55d","#e67e22","#eb459e","#00a8fc","#9b59b6","#e74c3c"];
let ready=null,db=null,ME=null;

function setup(cfg,name){
  return new Promise(res=>{
    const o=document.createElement("div");
    o.style.cssText="position:fixed;inset:0;z-index:99;background:#1e1f22;color:#dbdee1;display:flex;align-items:center;justify-content:center;padding:16px;font:15px system-ui,sans-serif";
    o.innerHTML='<div style="width:min(420px,100%);display:flex;flex-direction:column;gap:10px"><h2 style="margin:0;color:#fff">Кордик: первая настройка</h2><input id="sn" placeholder="Ваше имя" maxlength="24" style="padding:10px;border-radius:6px;border:0;background:#383a40;color:#fff"><textarea id="sc" rows="7" placeholder="Вставьте сюда firebaseConfig из консоли Firebase" style="padding:10px;border-radius:6px;border:0;background:#383a40;color:#fff"></textarea><div id="se" style="color:#f23f43"></div><button id="sb" style="padding:12px;border:0;border-radius:6px;background:#5865f2;color:#fff;font-weight:600">Продолжить</button></div>';
    document.body.append(o);
    const n=o.querySelector("#sn"),c=o.querySelector("#sc"),e=o.querySelector("#se");
    n.value=name||"";if(cfg)c.value=JSON.stringify(cfg);
    o.querySelector("#sb").onclick=()=>{
      const k={};
      for(const m of c.value.matchAll(/["']?(\w+)["']?\s*:\s*["']([^"']*)["']/g))k[m[1]]=m[2];
      const nm=n.value.trim();
      if(!nm){e.textContent="Введите имя";return}
      if(!k.apiKey||!k.projectId||!k.appId){e.textContent="Не вижу apiKey, projectId и appId. Скопируйте весь блок firebaseConfig.";return}
      o.remove();res({cfg:k,name:nm});
    };
  });
}

function mkRoom(base){
  const col=db.collection(base+"/peers"),ev=db.collection(base+"/events");
  let raw=[],prev=new Map(),list=[],isReady=false,hb=null,pd=null,pres={},ph=[],hs={},primed=false,pr;
  const seen=new Set(),primedP=new Promise(r=>{pr=r});
  const alive=d=>d&&Date.now()-d.ts<50000;
  const toPeer=(id,d)=>({peer:id,by:d.by||null,isMe:d.by===ME.id,sameTab:id===PEER,kind:"viewer",guest:false,presence:d.presence||{},updatedAt:d.ts});
  const recompute=()=>{
    const cur=new Map(),j=[],l=[],u=[];
    raw.forEach(([id,d])=>{if(alive(d))cur.set(id,toPeer(id,d))});
    cur.forEach((p,id)=>{const o=prev.get(id);if(!o)j.push(p);else if(JSON.stringify(o.presence)!==JSON.stringify(p.presence))u.push(p)});

    });
  },()=>{});
  addEventListener("pagehide",()=>{if(pd)pd.delete().catch(()=>{})});
  return{
    peers:()=>list,
    onPeers(h){ph.push(h);if(isReady&&list.length)h({peers:list,joined:list,left:[],updated:[]});return()=>{ph=ph.filter(x=>x!==h)}},
    on(t,f){(hs[t]=hs[t]||[]).push(f);return()=>{hs[t]=(hs[t]||[]).filter(x=>x!==f)}},

    },

  };
}

function explain(e){
  const c=String((e&&e.code)||""),m=String((e&&e.message)||e);
  if(/operation-not-allowed|admin-restricted/.test(c))return "В Firebase не включён анонимный вход.\nAuthentication → Sign-in method → Anonymous → Включить.";
  if(/invalid-api-key|api-key-not-valid/.test(c+m))return "Неверный apiKey. Нажмите «Изменить настройки» и вставьте firebaseConfig заново.";

  if(/permission-denied/.test(c))return "Firestore не пускает.\nFirestore Database → Правила → вставьте allow read, write: if request.auth != null; → Опубликовать.";
  if(c==="timeout"||/unavailable|network/.test(c))return "Нет ответа от базы. Проверьте интернет и что база создана: Build → Firestore Database → Create database.";
  if(/firebase is not defined/.test(m))return "Не загрузился Firebase: нет интернета или заблокирован gstatic.com.";

/* ---- голосовые звонки (WebRTC, сигналы через room) ---- */
const V={cid:null,name:"",room:null,pcs:{},aud:{},q:{},stream:null,offs:[],peers:[],muted:false,deaf:false,sp:{},an:{},vol:{},vs:{},vid:{},vsrc:null,vk:null,ctx:null,iv:null};
const ICE={iceServers:[{urls:"stun:stun.l.google.com:19302"}]};
const myId=()=>{const p=V.room&&V.room.peers().find(x=>x.isMe&&x.sameTab);return p&&p.peer};
const sig=(id,d)=>V.room&&V.room.emit("sig",{...d,to:id}).catch(()=>{});
function drawCall(){
  const sv=S.servers.find(x=>x.id===S.sid),mi=$("#umic"),di=$("#udeaf");
  $("#vp").hidden=!V.cid||V.direct;$("#cn").textContent=V.cid?V.name+" / "+(sv?sv.name:""):"";
  mi.textContent=V.muted?"🔇":"🎤";mi.classList.toggle("off",V.muted);
  di.textContent=V.deaf?"🔕":"🎧";di.classList.toggle("off",V.deaf);drawDm();
}
function mk(id){
  if(V.pcs[id])return V.pcs[id];
  const pc=new RTCPeerConnection(ICE);V.pcs[id]=pc;
  V.stream.getTracks().forEach(t=>pc.addTrack(t,V.stream));
  if(V.direct){const tv=pc.addTransceiver("video",{direction:"sendrecv"});V.vs[id]=tv.sender;if(V.vsrc)tv.sender.replaceTrack(V.vsrc.getVideoTracks()[0]).catch(()=>{})}
  pc.onicecandidate=e=>{if(e.candidate)sig(id,{k:"ice",c:e.candidate.toJSON()})};
  pc.ontrack=e=>{if(e.track.kind==="video"){V.vid[id]=new MediaStream([e.track]);drawDm();return}let a=V.aud[id];if(!a){a=V.aud[id]=new Audio();a.autoplay=true}a.srcObject=e.streams[0];a.muted=V.deaf;a.volume=(V.vol[id]==null?100:V.vol[id])/100;watch(e.streams[0],id);a.play().catch(()=>{})};
  pc.onconnectionstatechange=()=>{if(pc.connectionState==="failed"){toast("Не удалось соединиться с участником (сеть мешает)");drop(id)}};
  return pc;
}
function drop(id){
  const pc=V.pcs[id];if(pc){pc.onconnectionstatechange=null;pc.close()}
  const a=V.aud[id];if(a){a.srcObject=null}
  delete V.pcs[id];delete V.aud[id];delete V.q[id];delete V.an[id];delete V.sp[id];delete V.vs[id];delete V.vid[id];
}
async function call(id){
  const pc=mk(id),o=await pc.createOffer();await pc.setLocalDescription(o);
  sig(id,{k:"offer",s:{type:o.type,sdp:o.sdp}});
}
async function flush(id){const pc=V.pcs[id];for(const c of V.q[id]||[])await pc.addIceCandidate(c).catch(()=>{});V.q[id]=[]}
async function onSig(m){
  const d=m.data||{},id=m.peer;
  if(m.isMe||!V.cid)return;
  try{
    if(d.k==="hello"){drop(id);await call(id);return}
    if(!d.to||d.to!==myId())return;
    if(d.k==="offer"){
      const pc=mk(id);await pc.setRemoteDescription(d.s);await flush(id);
      const a=await pc.createAnswer();await pc.setLocalDescription(a);
      sig(id,{k:"answer",s:{type:a.type,sdp:a.sdp}});
    }else if(d.k==="answer"){
      const pc=V.pcs[id];if(pc){await pc.setRemoteDescription(d.s);await flush(id)}
    }else if(d.k==="ice"){
      const pc=V.pcs[id];if(!pc)return;
      if(pc.remoteDescription)await pc.addIceCandidate(d.c).catch(()=>{});else(V.q[id]=V.q[id]||[]).push(d.c);
    }
  }catch(e){}
}
async function joinVoice(c){
  if(V.cid===c.id)return;
  if(V.cid)await leaveVoice();
  const rm=window.claude?await claude.use("room"):null;
  if(!rm){toast("Звонки здесь недоступны — откройте страницу по ссылке в Claude");return}
  let st;
  try{st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}
  catch(e){toast("Нет доступа к микрофону — разрешите его или откройте страницу в отдельной вкладке");micCheck();return}
  const vr=await rm.join(c.room||("v-"+S.sid+"-"+c.id));
  V.stream=st;V.cid=c.id;V.name=c.name;V.room=vr;V.direct=!!c.direct;V.t0=0;V.muted=false;V.deaf=false;V.sp={};V.peers=[];V.q={};watch(st,"me");if(CFG.ptt)setMute(true);
  V.offs=[
    vr.on("sig",onSig),
    vr.onPeers(ch=>{
      V.peers=ch.peers.filter(p=>p.presence&&p.presence.voice);
      for(const p of ch.left)drop(p.peer);
      const ids=[...new Set(V.peers.map(p=>p.by).filter(i=>i&&!S.prof[i]))];
      if(ids.length&&user)user.profiles(ids).then(r=>{Object.assign(S.prof,r);drawChans()}).catch(()=>{});
      drawChans();drawCall();
    })
  ];
  await vr.presence({voice:true,muted:V.muted,deaf:false});
  await vr.emit("sig",{k:"hello"}).catch(()=>{});
  setTimeout(()=>{if(V.room===vr&&V.peers.length>1&&!Object.keys(V.pcs).length)vr.emit("sig",{k:"hello"}).catch(()=>{})},4000);
  drawChans();drawCall();
}
async function leaveVoice(){
  V.offs.forEach(f=>f());V.offs=[];
  Object.keys(V.pcs).forEach(drop);
  if(V.stream)V.stream.getTracks().forEach(t=>t.stop());
  try{await V.room.presence({voice:null});V.room.leave()}catch(e){}
  unwatch();if(V.vsrc){V.vsrc.getTracks().forEach(t=>t.stop());V.vsrc=null}V.vk=null;V.vs={};V.vid={};V.cid=null;V.room=null;V.stream=null;V.peers=[];V.muted=false;V.deaf=false;
  drawChans();drawCall();
}

function watch(stream,key){

  }catch(e){return}
  if(V.iv)return;

    const buf=new Uint8Array(128);
    for(const k in V.an){
      V.an[k].getByteFrequencyData(buf);
      const on=buf.reduce((a,x)=>a+x,0)/buf.length>18;
      if(!!V.sp[k]!==on){V.sp[k]=on;document.querySelectorAll('[data-k="'+k+'"]').forEach(e=>e.classList.toggle("sp",on))}
    }
  },150);
}

function shrink(f){
  return new Promise((ok,no)=>{
    const fr=new FileReader();
    fr.onerror=no;
    fr.onload=()=>{
      const im=new Image();im.onerror=no;
      im.onload=()=>{
        const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");
        c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
        c.getContext("2d").drawImage(im,0,0,c.width,c.height);
        let q=.7,d=c.toDataURL("image/jpeg",q);
        while(d.length>180000&&q>.3){q-=.1;d=c.toDataURL("image/jpeg",q)}
        d.length>240000?no():ok(d);
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(f);
  });
}

  };
  const mn=el("button",null,"⌄");mn.title="Свернуть";mn.onclick=()=>{S.min=true;drawDm()};
  const top=el("div","dmtop");top.append(mn,el("b",null,c.name),el("span","dmt",txt));
  const row=el("div","dmrow");
  row.append(tile(UID(),(me&&me.name)||"Вы","me",{muted:V.muted,deaf:V.deaf,vid:V.vk},V.vk?V.vsrc:null,true));
  const ot=tile(c.uid,c.name,oth&&oth.peer,pr,pr.vid&&oth?V.vid[oth.peer]:null,false);
  if(!oth)ot.classList.add("wait");
  row.append(ot);
  const items=[["📹",V.vk==="cam"?"off":"","Камера",()=>setVideo(V.vk==="cam"?null:"cam")]];
  if(navigator.mediaDevices&&navigator.mediaDevices.getDisplayMedia)items.push(["🖥",V.vk==="screen"?"off":"","Показ экрана",()=>setVideo(V.vk==="screen"?null:"screen")]);
  items.push([V.muted?"🔇":"🎤",V.muted?"off":"","Микрофон",()=>$("#umic").click()],[V.deaf?"🔕":"🎧",V.deaf?"off":"","Наушники",()=>$("#udeaf").click()],["📞","red","Завершить",hangup]);
  o.replaceChildren(top,row,bar(items,false));
}

applyUi();

async function send(){
  const i=$("#in"),t=i.value.trim();
  if(!t||!S.cid||!db)return;
  i.value="";fit();
  clearTimeout(tyOff);tyT=0;if(LB)LB.presence({typing:null}).catch(()=>{});
  try{await add({text:t.slice(0,2000)})}catch(e){i.value=t;toast("Не удалось отправить. "+errMsg(e))}
}
function fit(){const i=$("#in");i.style.height="auto";i.style.height=Math.min(i.scrollHeight,140)+"px"}

$("#go").onclick=send;
$("#in").oninput=()=>{fit();typing()};
$("#in").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};
$("#menu").onclick=()=>{$("#side").classList.add("open");$("#scrim").classList.add("open")};
$("#scrim").onclick=closeSide;

async function start(){
  drawRail();note("Подключаемся…");
  if(!window.claude||!claude.use){note("Откройте страницу по ссылке в Claude — там чат работает в реальном времени.");return}
  try{db=await claude.use("db");user=await claude.use("user")}catch(e){}
  if(!db){note("Не удалось подключиться. Проверьте интернет и настройки Firebase.");return}
  try{me=user?await user.me():null}catch(e){}
  userPanel();lobby();micCheck();
  db.collection("servers").orderBy("ts","asc").onSnapshot(sn=>{
    S.servers=sn.docs.map(d=>({id:d.id,...d.data()}));
    if(!S.servers.find(s=>s.id===S.sid))S.sid=null;
    if(!S.sid&&S.servers.length)pickServer(S.servers[0].id);
    else{drawRail();if(!S.servers.length){drawChans();noteBtn("Пока нет серверов (групп).","Создать сервер",()=>{const a=document.querySelector(".srv.add");if(a)a.click()})}}
  },e=>note("Ошибка загрузки: "+(e.message||e.code)));
}
start();
})();
</script>
<script>if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(function(){});</script>
